<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">Parliament Q&amp;A collector: data model</title>
  <desc id="desc">The YAML configuration starts a collection run. Lok Sabha and Rajya Sabha sources provide questions, which link to matches and documents. Search jobs and requests record coverage. The records are exported as CSV files.</desc>
